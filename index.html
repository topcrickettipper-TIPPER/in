<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    padding: 8px 8px 15px;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background:
        radial-gradient(
            circle at top,
            #8b238e 0%,
            #57156f 35%,
            #111b4d 100%
        );
}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
}

/* CARD */

.card {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 28px;
    padding: 30px 20px 25px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    text-align: center;
}

/* NAME */

.title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 18px;
    letter-spacing: -0.3px;
}

/* OFFICIAL CHANNEL */

.badge {
    display: inline-block;
    border: 2px solid #e66cff;
    border-radius: 30px;
    padding: 7px 18px;
    color: #ed7cff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 27px;
}

/* STATS */

.stats {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-bottom: 27px;
}

.stat-number {
    font-size: 23px;
    font-weight: 800;
}

.stat-label {
    margin-top: 5px;
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    letter-spacing: 1.5px;
}

/* LINE */

.line {
    height: 1px;
    background: rgba(255,255,255,0.20);
    margin-bottom: 28px;
}

/* FEATURES */

.features {
    text-align: left;
    margin-bottom: 28px;
}

.feature {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    margin: 17px 0;
    font-size: 13px;
    line-height: 1.45;
}

.icon {
    width: 21px;
    min-width: 21px;
    height: 21px;
    border: 2px solid white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    margin-top: 1px;
}

/* TELEGRAM BUTTON */

.join-btn {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 17px 12px;

    background: linear-gradient(
        90deg,
        #bd1bc4,
        #386be8
    );

    color: white;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .7px;

    cursor: pointer;
    text-decoration: none;
    display: block;

    /* BLINK / PULSE */
    animation: pulse 1.2s infinite;
}

/* BUTTON ANIMATION */

@keyframes pulse {

    0% {
        transform: scale(1);
        box-shadow:
            0 0 8px rgba(255,255,255,0.20);
    }

    50% {
        transform: scale(1.045);
        box-shadow:
            0 0 20px rgba(230,80,255,0.80),
            0 0 45px rgba(80,120,255,0.50);
    }

    100% {
        transform: scale(1);
        box-shadow:
            0 0 8px rgba(255,255,255,0.20);
    }
}

/* COUNTDOWN */

.countdown {
    margin-top: 20px;
    color: rgba(255,255,255,0.58);
    font-size: 13px;
}

#timer {
    color: #f06cff;
    font-weight: 800;
}

/* FOOTER */

.footer {
    text-align: center;
    margin-top: 25px;
    color: rgba(255,255,255,0.38);
    font-size: 11px;
}


/* =================================
   MOBILE
================================= */

@media (max-width: 500px) {

    body {
        padding: 6px 7px 12px;
    }

    .card {
        padding: 28px 19px 24px;
        border-radius: 25px;
    }

    .title {
        font-size: 23px;
        margin-bottom: 17px;
    }

    .badge {
        font-size: 10px;
        padding: 7px 17px;
        margin-bottom: 25px;
    }

    .stats {
        gap: 50px;
        margin-bottom: 25px;
    }

    .stat-number {
        font-size: 22px;
    }

    .stat-label {
        font-size: 9px;
    }

    .feature {
        font-size: 13px;
        margin: 16px 0;
    }

    .join-btn {
        font-size: 14px;
        padding: 16px 12px;
    }

    .countdown {
        font-size: 13px;
    }

    .footer {
        font-size: 10px;
    }
}

<script>

let seconds = 15;

const timer = document.getElementById("timer");

const countdown = setInterval(function () {

    seconds--;

    if (seconds < 10) {
        timer.textContent = "0" + seconds;
    } else {
        timer.textContent = seconds;
    }

    if (seconds <= 0) {

        clearInterval(countdown);

        window.location.href =
            "https://t.me/+NE-Ny3wwlQU1ZTNl";

    }

}, 1000);

</script>
